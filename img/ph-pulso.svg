<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Pulso">
  <defs>
    <linearGradient id="plBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1412"/>
      <stop offset="100%" stop-color="#05201d"/>
    </linearGradient>
    <radialGradient id="plGlow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0%" stop-color="#4ecdc4" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#4ecdc4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="plGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#4ecdc4" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#plBg)"/>
  <rect width="800" height="500" fill="url(#plGrid)"/>
  <rect width="800" height="500" fill="url(#plGlow)"/>

  <!-- ECG line -->
  <path d="M120 200 H265 l22 -58 l26 116 l24 -140 l26 152 l22 -70 H680"
        fill="none" stroke="#4ecdc4" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="680" cy="200" r="9" fill="#4ecdc4"/>

  <text x="400" y="330" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="52" font-weight="700" fill="#eeeeee" letter-spacing="1">Pulso</text>
  <text x="400" y="372" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="600" fill="#4ecdc4" letter-spacing="3">SAAS · FRONTEND LEAD</text>
  <text x="400" y="408" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" fill="#888888">React · TypeScript · Django · PostgreSQL</text>
</svg>
