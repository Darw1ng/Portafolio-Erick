    <rect x="-42" y="-52" width="44" height="126" rx="6"/>
    <rect x="12" y="-14" width="44" height="88" rx="6"/>
    <line x1="-96" y1="6" x2="-52" y2="6"/>
    <line x1="-42" y1="-16" x2="2" y2="-16"/>
    <line x1="12" y1="22" x2="56" y2="22"/>
    <line x1="-110" y1="74" x2="96" y2="74" stroke-linecap="round"/>
  </g>

  <text x="400" y="330" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="52" font-weight="700" fill="#eeeeee" letter-spacing="1">Quijote</text>
  <text x="400" y="372" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="600" fill="#4ecdc4" letter-spacing="3">MONOREPO FRONTEND</text>
  <text x="400" y="408" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" fill="#888888">React 19 · TypeScript · Turborepo · pnpm</text>
