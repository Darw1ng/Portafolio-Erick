<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Quijote">
  <defs>
    <linearGradient id="qjBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1412"/>
      <stop offset="100%" stop-color="#05201d"/>
    </linearGradient>
    <radialGradient id="qjGlow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0%" stop-color="#4ecdc4" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#4ecdc4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="qjGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#4ecdc4" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#qjBg)"/>
  <rect width="800" height="500" fill="url(#qjGrid)"/>
  <rect width="800" height="500" fill="url(#qjGlow)"/>

